# 公開後7日待つ。既存lockfileも検証し、日時不明の依存は拒否する。
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# GHSA-27r3-jxmh-p828: 2026-10-29 11:39:39 UTC以降に例外を削除する。
minimumReleaseAgeExclude:
  - body-parser@2.4.0
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true

# 未審査のスクリプトを拒否。esbuildはbinary選択・検証、fseventsは実行不要。
strictDepBuilds: true
allowBuilds:
  esbuild@0.28.1: true
  fsevents@2.3.3: false
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
sideEffectsCache: false
verifyDepsBeforeRun: error
nodeVersion: 24.15.0
engineStrict: true
strictPeerDependencies: true
saveExact: true
# mise / CIがpnpmを供給し、preinstallが版違いを拒否する。
pmOnFail: ignore

# npmで適用していたセキュリティ修正を維持する。
overrides:
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'ip-address@<10.7.4': 10.7.4
  brace-expansion@5: ^5.0.9
  js-yaml@4: ^4.3.0
  nanoid@3: ^3.3.18
  postcss: ^8.5.18
  # GHSA-587h-7wmj-h5pm: Windowsのlaunch-editor経由の問題を修正。
  "vite@>=8.3.0 <8.3.3": 8.3.3
