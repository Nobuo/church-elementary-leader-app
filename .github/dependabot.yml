# 依存の脆弱性・更新を自動でPR化する。セキュリティ更新はスケジュール外でも随時PRが立つ。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 公開直後のバージョンはPRにしない(サプライチェーン攻撃対策)。
    # cooldownはversion updatesのみに効き、セキュリティ更新は即日PRが立つ。
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    ignore:
      # @typescript-eslint/* のpeerが typescript ">=4.8.4 <6.1.0" のため、
      # TS6以降を入れると npm ci が ERESOLVE で失敗する(PR #13)。
      # typescript-eslintが対応したらこのignoreを外す。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
