name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Every Monday 00:00 UTC (09:00 JST)

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # CI/CDパイプライン用のeBPFランタイムセキュリティセンサー(検出のみ、ビルドは止めない)。
      # 依存のインストールやビルド中に起きる不審なプロセス・通信・ファイル操作を捕まえる。
      # ログ・イベントは外部に送られずこのリポジトリのartifactに留まる。
      # 必ず最初のステップに置く(以降のステップを監視対象にするため)。
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # eBPFランタイムセキュリティセンサー(検出のみ、ビルドは止めない)。
      # 必ず最初のステップに置く(以降のステップを監視対象にするため)。
      # artifact名はaction側で固定のため(cicd-sensor-report / cicd-sensor-attestation)、
      # 同一ワークフロー実行内の複数ジョブが出すと後発が409になる。actionはwarningに
      # するだけなのでジョブは緑のまま、レポートだけ黙って消える。artifactの発行は
      # build-and-testジョブに任せ、ここは検出のみ(検出結果はジョブログとStep Summaryに出る)。
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
        with:
          enable-html-report: 'false'
          enable-attestation-artifact: 'false'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
