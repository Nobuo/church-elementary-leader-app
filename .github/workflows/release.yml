name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Cross-compile for all platforms from single runner
      - name: Build macOS ARM64
        run: bun build --compile --target=bun-darwin-arm64 ./src/main-bun.ts --outfile dist/leader-app-darwin-arm64

      - name: Build macOS x64
        run: bun build --compile --target=bun-darwin-x64 ./src/main-bun.ts --outfile dist/leader-app-darwin-x64

      - name: Build Windows x64
        run: bun build --compile --target=bun-windows-x64 ./src/main-bun.ts --outfile dist/leader-app-windows-x64.exe

      # Create archives with public/ included
      - name: Create archives
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # macOS ARM64
          mkdir -p staging/leader-app
          cp dist/leader-app-darwin-arm64 staging/leader-app/leader-app
          cp -r public staging/leader-app/public
          cd staging && tar czf ../dist/leader-app-${VERSION}-darwin-arm64.tar.gz leader-app && cd ..
          rm -rf staging/leader-app

          # macOS x64
          mkdir -p staging/leader-app
          cp dist/leader-app-darwin-x64 staging/leader-app/leader-app
          cp -r public staging/leader-app/public
          cd staging && tar czf ../dist/leader-app-${VERSION}-darwin-x64.tar.gz leader-app && cd ..
          rm -rf staging/leader-app

          # Windows x64
          mkdir -p staging/leader-app
          cp dist/leader-app-windows-x64.exe staging/leader-app/leader-app.exe
          cp -r public staging/leader-app/public
          cd staging && zip -r ../dist/leader-app-${VERSION}-windows-x64.zip leader-app && cd ..
          rm -rf staging/leader-app

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" "${PREV_TAG}..HEAD")
          fi

          FEAT=""
          FIX=""
          SEC=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              feat:*)     FEAT="$FEAT"$'\n'"- $line" ;;
              fix:*)      FIX="$FIX"$'\n'"- $line" ;;
              security:*) SEC="$SEC"$'\n'"- $line" ;;
              *)          OTHER="$OTHER"$'\n'"- $line" ;;
            esac
          done <<< "$COMMITS"

          {
            echo "BODY<<CHANGELOG_EOF"
            [ -n "$FEAT" ] && printf '## 🆕 新機能\n%s\n\n' "$FEAT"
            [ -n "$FIX" ] && printf '## 🐛 バグ修正\n%s\n\n' "$FIX"
            [ -n "$SEC" ] && printf '## 🔒 セキュリティ\n%s\n\n' "$SEC"
            [ -n "$OTHER" ] && printf '## 🔧 その他\n%s\n\n' "$OTHER"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body: ${{ steps.changelog.outputs.BODY }}
          files: |
            dist/leader-app-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            dist/leader-app-${{ steps.version.outputs.VERSION }}-darwin-x64.tar.gz
            dist/leader-app-${{ steps.version.outputs.VERSION }}-windows-x64.zip
