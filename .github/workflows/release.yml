name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Cross-compile for all platforms from single runner
      - name: Build macOS ARM64
        run: bun build --compile --target=bun-darwin-arm64 ./src/main-bun.ts --outfile dist/leader-app-darwin-arm64

      - name: Build macOS x64
        run: bun build --compile --target=bun-darwin-x64 ./src/main-bun.ts --outfile dist/leader-app-darwin-x64

      - name: Build Windows x64
        run: bun build --compile --target=bun-windows-x64 ./src/main-bun.ts --outfile dist/leader-app-windows-x64.exe

      - name: Create Windows archive
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p staging/leader-app
          cp dist/leader-app-windows-x64.exe staging/leader-app/leader-app.exe
          cp -r public staging/leader-app/public
          cd staging && zip -r ../dist/leader-app-${VERSION}-windows-x64.zip leader-app && cd ..
          rm -rf staging/leader-app

      # macOS版はLinux上でbunが付けたad-hoc署名がmacOS側で無効判定されるため、
      # ここではアーカイブ化せず、バイナリのまま sign-macos ジョブへ渡す。
      - name: Upload macOS binaries for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: darwin-binaries
          path: dist/leader-app-darwin-*
          retention-days: 1

      - name: Upload Windows archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: dist/*.zip
          retention-days: 1

  # Linuxでクロスコンパイルしたdarwinバイナリは、bunが埋め込むad-hoc署名が
  # macOS側で「invalid signature」と判定され、起動時にAMFIへSIGKILLされる。
  # (v1.0.22以前の配布物は全てこの状態で、ダウンロードしても起動しなかった)
  # macOSランナー上で署名し直し、配布物と同じ構成で実際に起動確認する。
  sign-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: darwin-binaries
          path: dist

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Re-sign macOS binaries
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            f="dist/leader-app-darwin-${arch}"
            chmod +x "$f"   # upload-artifactは実行権限を保持しないため戻す
            codesign --force --sign - "$f"
            codesign --verify --verbose "$f"
          done

      # 配布されるtar.gzと同じ構成(バイナリの隣にpublic/)を作る。
      # main-bun.ts が path.dirname(process.execPath) で public/ を探すため、
      # この配置でないと静的ファイルを解決できない。
      - name: Stage macOS archives
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            mkdir -p "staging-${arch}/leader-app"
            cp "dist/leader-app-darwin-${arch}" "staging-${arch}/leader-app/leader-app"
            cp -r public "staging-${arch}/leader-app/public"
          done

      # 署名が有効かを「実際に起動して」確認する。codesign --verify だけでは
      # AMFIによるkillを検出できないため、配布物そのものをここで動かす。
      - name: Smoke test (arm64)
        run: |
          set -uo pipefail
          cd staging-arm64/leader-app
          PORT=3999 DB_PATH="${RUNNER_TEMP}/smoke.db" ./leader-app > smoke.log 2>&1 &
          PID=$!
          for _ in $(seq 1 60); do
            if curl -fs -o /dev/null "http://localhost:3999/api/members"; then
              echo "API応答OK"
              curl -fs -o /dev/null "http://localhost:3999/" && echo "静的ファイル配信OK"
              kill "$PID" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::署名後もバイナリが起動しない(AMFI killと同じ症状)"
              cat smoke.log || true
              exit 1
            fi
            sleep 0.5
          done
          echo "::error::起動タイムアウト"
          cat smoke.log || true
          kill "$PID" 2>/dev/null || true
          exit 1

      - name: Create macOS archives
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.VERSION }}
          for arch in arm64 x64; do
            rm -f "staging-${arch}/leader-app/smoke.log"
            tar czf "dist/leader-app-${VERSION}-darwin-${arch}.tar.gz" -C "staging-${arch}" leader-app
          done

      - name: Upload macOS archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: dist/*.tar.gz
          retention-days: 1

  release:
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" "${PREV_TAG}..HEAD")
          fi

          FEAT=""
          FIX=""
          SEC=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Conventional Commitsのスコープ付き(feat(ui): など)も拾う。
            # セキュリティはスコープ側に現れるため(chore(security): 等)最初に判定する。
            case "$line" in
              security:*|*\(security\):*) SEC="$SEC"$'\n'"- $line" ;;
              feat:*|feat\(*\):*)         FEAT="$FEAT"$'\n'"- $line" ;;
              fix:*|fix\(*\):*)           FIX="$FIX"$'\n'"- $line" ;;
              *)                          OTHER="$OTHER"$'\n'"- $line" ;;
            esac
          done <<< "$COMMITS"

          {
            echo "BODY<<CHANGELOG_EOF"
            [ -n "$FEAT" ] && printf '## 🆕 新機能\n%s\n\n' "$FEAT"
            [ -n "$FIX" ] && printf '## 🐛 バグ修正\n%s\n\n' "$FIX"
            [ -n "$SEC" ] && printf '## 🔒 セキュリティ\n%s\n\n' "$SEC"
            [ -n "$OTHER" ] && printf '## 🔧 その他\n%s\n\n' "$OTHER"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body: ${{ steps.changelog.outputs.BODY }}
          files: |
            dist/leader-app-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            dist/leader-app-${{ steps.version.outputs.VERSION }}-darwin-x64.tar.gz
            dist/leader-app-${{ steps.version.outputs.VERSION }}-windows-x64.zip
