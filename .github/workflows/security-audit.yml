name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 4' # 毎週木曜 00:00 UTC (09:00 JST)。月曜のCIフルランと分散
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # CI/CDパイプライン用のeBPFランタイムセキュリティセンサー(検出のみ、ビルドは止めない)。
      # 依存のインストールやビルド中に起きる不審なプロセス・通信・ファイル操作を捕まえる。
      # ログ・イベントは外部に送られずこのリポジトリのartifactに留まる。
      # 必ず最初のステップに置く(以降のステップを監視対象にするため)。
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: |
          set -o pipefail
          pnpm audit --audit-level=high 2>&1 | tee audit.log
      - name: 検出時はIssueで通知(既存Issueがあればコメント追記)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create security-audit --force --description "自動セキュリティ監査" --color D93F0B
          BODY="週次セキュリティ監査で high 以上の脆弱性を検出しました。

          Run: ${RUN_URL}

          \`\`\`
          $(tail -c 60000 audit.log 2>/dev/null || echo 'audit.logなし(pnpm install --frozen-lockfile等の失敗の可能性。Runログを確認)')
          \`\`\`

          ## 対応手順

          1. Dependabotのセキュリティ更新PRが出ていればマージする(cooldown対象外なので即日出る)
          2. PRがなければローカルで対象依存を \`pnpm update <package>\` し、lockfile差分とテストを確認する
          3. 修正版が公開7日未満の場合は SECURITY.md の手順で対象バージョンだけ例外を追加する

          公開待機やビルド許可を全体で無効化しないでください。"
          EXISTING=$(gh issue list --state open --label security-audit --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "security-audit: pnpm依存に脆弱性を検出" --label security-audit --assignee "${{ github.repository_owner }}" --body "$BODY"
          fi
      - name: 緑に戻ったら監査Issueを自動クローズ
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list --state open --label security-audit --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "週次監査が緑に戻ったため自動クローズします。"
          fi
