name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 4' # 毎週木曜 00:00 UTC (09:00 JST)。月曜のCIフルランと分散
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: npm audit
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee audit.log
      - name: 検出時はIssueで通知(既存Issueがあればコメント追記)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create security-audit --force --description "自動セキュリティ監査" --color D93F0B
          BODY="週次セキュリティ監査で high 以上の脆弱性を検出しました。

          Run: ${RUN_URL}

          \`\`\`
          $(tail -c 60000 audit.log 2>/dev/null || echo 'audit.logなし(npm ci等の失敗の可能性。Runログを確認)')
          \`\`\`

          ## 対応手順

          1. Dependabotのセキュリティ更新PRが出ていればマージする(cooldown対象外なので即日出る)
          2. PRがなければローカルで \`npm audit fix\`

          ### \`npm audit fix\` が「fixがblockされた」と言って失敗する場合

          修正版が公開7日未満で、\`.npmrc\` の \`min-release-age=7\` に止められています。
          その脆弱性の**該当パッケージだけ**ゲートを外してください:

          \`\`\`
          npm run audit:fix:urgent:preview -- <package>   # まず差分を確認
          npm run audit:fix:urgent -- <package>           # 実行
          \`\`\`

          \`--min-release-age=0\` でも直せますが、依存ツリー全体のゲートが外れて
          無関係な依存まで公開直後の版に上がるため、緊急時ほど対象を絞ってください。"
          EXISTING=$(gh issue list --state open --label security-audit --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "security-audit: npm依存に脆弱性を検出" --label security-audit --assignee "${{ github.repository_owner }}" --body "$BODY"
          fi
      - name: 緑に戻ったら監査Issueを自動クローズ
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list --state open --label security-audit --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "週次監査が緑に戻ったため自動クローズします。"
          fi
